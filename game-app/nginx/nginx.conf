server {
    listen 8080;

    location = /stone {
    return 301 /stone/;
    }

    location = /toss {
        return 301 /toss/;
    }

    location /stone/ {
        proxy_pass http://stone:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /stone;
    }

     location /toss/ {
        proxy_pass http://toss:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /toss;
    }

}