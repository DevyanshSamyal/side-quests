<!DOCTYPE html>
<html>
    <head>
        <title>Stone Paper Scissors</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>

        <h1 id="heading">STONE PAPER SCISSORS</h1>

        <h2>Scoreboard</h2>

        <p id="player-score">Your Score: 0</p>
        <p id="computer-score">Computer Score: 0</p>

        <h2>Make Your Move</h2>

        <button id="stone">Stone</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
        <br>
        <button id="reset">Reset Score</button>

        <h2>Result</h2>

        <p id="player-choice">Your choice: -</p>
        <p id="computer-choice">Computer's choice: -</p>

        <h3 id="result">Waiting for your move...</h3>

        <script>
             const playGameUrl = "{{ url_for('play_game') }}";
        </script>
        
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
