http { 
    include mime.types;

    upstream backend { 
            server app1:7777;
            server app2:7778;
            server app3:7779;
     }

    server { 
        listen 8080;
        root /usr/share/nginx/html;

        location / {
            proxy_pass http://backend/ ;
        }

        location /cats {
            root /usr/share/nginx/html;
        }
        location /pets {
            alias /usr/share/nginx/html/cats;
        }
        location /dogs {
            root /usr/share/nginx/html;
            try_files /dogs/dogs.html /index.html =404;
        }
        location /dog {
            return 307 /dogs;
        }
     }
 }

events { }